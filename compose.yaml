# Local development, start with `make dev`
# UI with hot reload: http://localhost:3001, backend: http://localhost:3000, mails: http://localhost:8025
services:
  rmfakecloud:
    build: .
    user: "${DEV_UID:-0}:${DEV_GID:-0}"
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET_KEY: dev
      LOGLEVEL: debug
      RM_SMTP_SERVER: mailpit:1025
      RM_SMTP_NOTLS: 1
      RM_OCR_URL: http://ocr:8080
    volumes:
      - ./data:/data
    develop:
      watch:
        - path: ./cmd
          action: rebuild
        - path: ./internal
          action: rebuild
        - path: ./go.mod
          action: rebuild
        - path: ./go.sum
          action: rebuild

  ui:
    image: node:26
    working_dir: /src
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "3001:3001"
    environment:
      API_URL: http://rmfakecloud:3000
    volumes:
      - ./ui:/src
      # native linux binaries (tailwind, swc, rolldown), kept apart from the host's node_modules
      - ui_node_modules:/src/node_modules

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  # ocr sidecar for RM_OCR_URL
  ocr:
    build:
      context: .
      dockerfile: docker/ocr.Dockerfile
    develop:
      watch:
        - path: ./cmd/ocrserver
          action: rebuild
        - path: ./docker/ocr.Dockerfile
          action: rebuild

  # empty instance for the Cypress tests, started by `make e2e`
  e2e:
    profiles: [e2e]
    build: .
    ports:
      - "3002:3000"
    environment:
      JWT_SECRET_KEY: e2e
    tmpfs:
      - /data

volumes:
  ui_node_modules:
