{{- if not .Values.existingSecret }}
{{- /* keep the key of an earlier install, new keys would log out every tablet and browser */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Release.Name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "rmfakecloud.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET_KEY: {{ dig "data" "JWT_SECRET_KEY" (randAlphaNum 48 | b64enc) $existing }}
{{- end }}
