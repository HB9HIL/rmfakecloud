name: CI

# Pull request: tests and CodeQL.
# Push to master: additionally the image (git describe + bleeding_edge) and the docs.
# Tag vX.Y.Z: additionally the image (X.Y.Z + latest) and the GitHub release with binaries.
# Manual run: image tagged with the git describe of the selected branch.
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  schedule:
    - cron: '41 21 * * 5'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  # A tag needs a CHANGELOG section, checked before anything is published
  changelog:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/changelog.yml

  docker:
    needs: [tests, changelog]
    # changelog is skipped outside of tags, !failure() lets that pass
    if: >-
      !failure() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/master')))
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write

  release:
    needs: [tests, changelog]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write

  docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: write
