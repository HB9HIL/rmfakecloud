name: Docs

# mkdocs to the gh-pages branch
on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: pip install "mkdocs<2" mkdocs-material
      - run: mkdocs gh-deploy --force
