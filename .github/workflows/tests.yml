name: Tests

on:
  workflow_call:

jobs:
  go:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The binary embeds ui/dist, a placeholder is enough to compile and test
      - run: mkdir -p ui/dist && touch ui/dist/index.html
      - run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  helm:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: helm lint --strict helm
      - run: >-
          helm lint --strict helm --set ocr.enabled=true,ingress.enabled=true,ingress.host=rm.example.com,ingress.tlsSecretName=rm-tls,strategy.type=RollingUpdate,existingSecret=rm,persistence.enabled=false

  ui:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # embedded into the release binaries
      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  e2e:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: make e2e
      # traces open on trace.playwright.dev
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: e2e/test-results
