name: Tests

on:
  workflow_call:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The binary embeds ui/dist, a placeholder is enough to compile and test
      - run: mkdir -p ui/dist && touch ui/dist/index.html
      - run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # embedded into the release binaries
      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # npm ci downloads the Cypress binary into ~/.cache/Cypress
      - uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ hashFiles('e2e/package-lock.json') }}
      - run: make e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots
          path: e2e/cypress/screenshots
