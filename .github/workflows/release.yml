name: Create release on tag push

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The binary embeds ui/dist, a placeholder is enough to compile and test
      - run: mkdir -p ui/dist && touch ui/dist/index.html
      - run: go vet ./...
      - run: go test -race ./...
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No changelog section found for version $version"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release_notes.md

  ui:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist

  build:
    needs: ui
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, name: linux-amd64 }
          - { goos: linux, goarch: arm64, name: linux-arm64 }
          - { goos: linux, goarch: arm, goarm: '7', name: linux-armv7 }
          - { goos: linux, goarch: arm, goarm: '6', name: linux-armv6 }
          - { goos: windows, goarch: amd64, name: windows-amd64.exe }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist
      - run: go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o dist/rmfakecloud-${{ matrix.name }} ./cmd/rmfakecloud
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
      - uses: actions/upload-artifact@v7
        with:
          name: rmfakecloud-${{ matrix.name }}
          path: dist/rmfakecloud-${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: rmfakecloud-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: dist/*
