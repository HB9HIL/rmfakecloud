name: Release

# Binaries with the UI from the tests workflow, release notes from the changelog workflow
on:
  workflow_call:

jobs:
  binaries:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, name: linux-amd64 }
          - { goos: linux, goarch: arm64, name: linux-arm64 }
          - { goos: linux, goarch: arm, goarm: '7', name: linux-armv7 }
          - { goos: linux, goarch: arm, goarm: '6', name: linux-armv6 }
          - { goos: windows, goarch: amd64, name: windows-amd64.exe }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist
      - run: go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o dist/rmfakecloud-${{ matrix.name }} ./cmd/rmfakecloud
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
      - uses: actions/upload-artifact@v7
        with:
          name: rmfakecloud-${{ matrix.name }}
          path: dist/rmfakecloud-${{ matrix.name }}
          retention-days: 1

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: rmfakecloud-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: dist/*
