name: mkdocs
on:
  push:
    branches:
      - master
      - main
    #paths:
    #  - 'docs/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: pip install "mkdocs<2" mkdocs-material
      - run: mkdocs gh-deploy --force
