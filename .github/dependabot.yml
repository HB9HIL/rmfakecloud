version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: [/ui, /e2e]
    schedule:
      interval: daily
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/, /docker]
    schedule:
      interval: daily
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
